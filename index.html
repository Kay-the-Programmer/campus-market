<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!--
    viewport-fit=cover is what makes env(safe-area-inset-*) a real number.

    Without it iOS letterboxes the page inside the safe area and reports every
    inset as 0 - so the bottom nav's padding-bottom: env(safe-area-inset-bottom)
    resolved to nothing, and on a Home Screen app on any iPhone with a home
    indicator the bar rendered at its no-notch height with the indicator sitting
    on top of it. The CSS for this was already written and correct; it had just
    never been switched on.

    It is a trade: the page now paints edge to edge, under the status bar as
    well, so anything pinned to an edge pads itself with the matching inset.
    See the header below and .safe-area-pb in index.css.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CampusMarket — Student Exchange</title>
  <meta name="description" content="CampusMarket is the trusted student-only marketplace for buying and selling textbooks, electronics, food, and services on campus." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/images/logo.png" />

  <!--
    Installability, which on iOS is what makes notifications possible at all.

    Apple exposes the Notification and Push APIs only to web apps added to
    the Home Screen - in an ordinary Safari tab they are not defined on any
    version of iOS. And "Add to Home Screen" only produces a real web app,
    rather than a Safari shortcut that cannot receive push, when the site
    declares a display mode. Without the two lines below, every iPhone user
    is silently excluded from notifications.
  -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#2563eb" />

  <!-- Apple honours the manifest from iOS 16.4, but still reads these, and
       they cost nothing on the versions that predate it. -->
  <!-- Both spellings on purpose. Chrome deprecated the apple- prefixed one and
       warns in the console about it, but iOS Safari still reads only that name,
       and it is the one that makes an added-to-home-screen app run standalone -
       which is the whole reason iPhones can receive push at all here. -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="CampusMarket" />

  <!-- 180x180 and opaque: iOS composites a transparent icon onto black. -->
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
