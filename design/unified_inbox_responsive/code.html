    let activeThreadId = null;

    // DOM Elements
    const threadList = document.getElementById('thread-list');
    const detailPane = document.getElementById('detail-pane');
    const chatMessages = document.getElementById('chat-messages');
    const backBtn = document.getElementById('back-button');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const activeUserName = document.getElementById('active-user-name');
    const activeUserAvatar = document.getElementById('active-user-avatar');
    const listingPinned = document.getElementById('listing-pinned');
    const inputBar = document.getElementById('input-bar');

    function renderThreads(filter = 'all') {
        threadList.innerHTML = '';
        const filtered = threads.filter(t => filter === 'all' || t.type === filter || (filter === 'unread' && t.unread));
        
        filtered.forEach(t => {
            const div = document.createElement('div');
            div.className = `flex items-center gap-3 p-4 cursor-pointer hover:bg-surface-variant transition-colors border-l-4 ${t.id === activeThreadId ? 'bg-primary/5 border-primary' : 'border-transparent'}`;
            div.onclick = () => selectThread(t.id);
            
            div.innerHTML = `
                <div class="relative flex-shrink-0">
                    <img class="w-12 h-12 rounded-full object-cover" src="${t.avatar}">
                    ${t.unread ? '<div class="absolute bottom-0 right-0 w-3 h-3 bg-primary rounded-full border-2 border-surface"></div>' : ''}
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex justify-between items-start mb-0.5">
                        <span class="font-label-md text-on-surface truncate">${t.name}</span>
                        <span class="text-[11px] text-outline whitespace-nowrap">${t.time}</span>
                    </div>
                    <p class="text-body-sm text-on-surface-variant truncate ${t.unread ? 'font-semibold text-on-surface' : ''}">${t.lastMsg}</p>
                </div>
                <div class="flex-shrink-0">
                    <img class="w-10 h-10 rounded-lg object-cover border border-outline-variant ${!t.unread ? 'opacity-70' : ''}" src="${t.listing.img}">
                </div>
            `;
            threadList.appendChild(div);
        });
    }

    function selectThread(id) {
        activeThreadId = id;
        const thread = threads.find(t => t.id === id);
        thread.unread = false; // Mark as read
        
        // Show detail pane on mobile
        detailPane.classList.remove('translate-x-full');
        
        // Update header info
        activeUserName.innerText = thread.name;
        activeUserAvatar.style.backgroundImage = `url(${thread.avatar})`;
        activeUserAvatar.style.backgroundSize = 'cover';
        
        // Update pinned listing
        listingPinned.classList.remove('hidden');
        listingPinned.classList.add('lg:flex');
        document.getElementById('pinned-listing-img').src = thread.listing.img;
        document.getElementById('pinned-listing-title').innerText = thread.listing.title;
        document.getElementById('pinned-listing-price').innerText = thread.listing.price;
        
        // Update input bar
        inputBar.classList.remove('hidden');
        
        // Show seller action for specific user
        if (thread.name === "Alex Rivers") {
            document.getElementById('seller-action-bar').classList.remove('hidden');
        } else {
            document.getElementById('seller-action-bar').classList.add('hidden');
        }

        renderMessages(thread);
        renderThreads(); // Update selection styling in list
    }

    function renderMessages(thread) {
        chatMessages.innerHTML = '';
        
        // Group Header
        const dateHeader = document.createElement('div');
        dateHeader.className = 'flex justify-center my-4';
        dateHeader.innerHTML = `<span class="px-3 py-1 bg-surface-container text-[11px] font-bold text-outline rounded-full uppercase tracking-widest">Today</span>`;
        chatMessages.appendChild(dateHeader);

        thread.history.forEach(msg => {
            const isMe = msg.sender === 'me';
            const bubble = document.createElement('div');
            bubble.className = `flex ${isMe ? 'flex-col items-end self-end' : 'gap-3'} max-w-[85%]`;
            
            if (isMe) {
                bubble.innerHTML = `
                    <div class="bg-primary-container text-on-primary-container p-3 lg:p-4 rounded-2xl rounded-br-none shadow-sm">
                        <p class="text-body-md">${msg.text}</p>
                    </div>
                    <span class="text-[10px] text-outline mt-1 mr-1">${msg.time} · Seen</span>
                `;
            } else {
                bubble.innerHTML = `
                    <div class="flex-shrink-0 self-end">
                        <img class="w-8 h-8 rounded-full border border-outline-variant" src="${thread.avatar}">
                    </div>
                    <div class="space-y-1">
                        <div class="bg-surface-container-highest text-on-surface p-3 lg:p-4 rounded-2xl rounded-bl-none shadow-sm">
                            <p class="text-body-md">${msg.text}</p>
                        </div>
                        <span class="text-[10px] text-outline ml-1">${msg.time}</span>
                    </div>
                `;
            }
            chatMessages.appendChild(bubble);
        });
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function sendMessage() {
        const text = messageInput.value.trim();
        if (!text || !activeThreadId) return;

        const thread = threads.find(t => t.id === activeThreadId);
        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        
        const newMsg = { sender: "me", text: text, time: timeStr };
        thread.history.push(newMsg);
        thread.lastMsg = text;
        thread.time = "Just now";

        messageInput.value = '';
        messageInput.style.height = 'auto';
        renderMessages(thread);
        renderThreads();
    }

    // Event Listeners
    backBtn.addEventListener('click', () => {
        detailPane.classList.add('translate-x-full');
    });

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // Auto-expanding textarea
    messageInput.addEventListener('input', function() {
        this.style.height = 0;
        this.style.height = (this.scrollHeight) + "px";
    });

    // Filter switching
    document.querySelectorAll('.filter-tab').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-tab').forEach(b => {
                b.classList.remove('bg-primary-container', 'text-on-primary-container');
                b.classList.add('bg-surface-container-high', 'text-on-surface-variant');
            });
            btn.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
            btn.classList.add('bg-primary-container', 'text-on-primary-container');
            renderThreads(btn.dataset.filter);
        });
    });

    // Initial render
    renderThreads();
</script>
</body></html>
