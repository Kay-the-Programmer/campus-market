# Production overlay for the shared VM.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Naming both files explicitly is what excludes docker-compose.override.yml and
# everything in it. Put that command in a shell alias or a Makefile target on
# the box - typing a bare `docker compose up` there would silently pull in the
# dev overrides, which is precisely the failure this split exists to prevent.
#
# There is deliberately no edge (Caddy) service here.
#
# This VM already runs the SalePilot stack, whose Caddy publishes host ports 80
# and 443. Two containers cannot publish the same port, so an edge of our own
# would simply fail to start - and did: campusmarket.salepilot.space answered
# 502 for every request because the only Caddy on the box could not route to
# this project's api container across the Docker network boundary.
#
# So SalePilot's Caddy is the single edge for the whole box. It terminates TLS
# for campusmarket.salepilot.space and proxies to `api` below over the shared
# `edge` network. The frontend lives on Vercel, so nothing here needs to serve
# static files either - this project is an API on this VM and nothing more.
#
# Create the shared network once per box, before the first `up`:
#
#   docker network create edge
#
# Required in .env alongside POSTGRES_PASSWORD:
#   CAMPUSMARKET_CORS_ORIGINS   comma-separated browser origins allowed to call
#                               this API - i.e. where the frontend is served
#                               from, NOT this API's own domain.

services:
  api:
    # Joined so SalePilot's Caddy, which lives in a different Compose project
    # and therefore a different default network, can reach this container at
    # all. `campusmarket-api` is pinned as an alias rather than relying on the
    # service name: `api` is generic enough to collide with the next project
    # that joins this network, and the edge config references it by name.
    networks:
      default: {}
      edge:
        aliases:
          - campusmarket-api
    environment:
      # Belt and braces. application.yml already defaults this to false, but
      # the flag is dangerous enough to be worth stating where someone reading
      # the production config can see it.
      CAMPUSMARKET_EXPOSE_DEV_TOKENS: "false"
      SERVER_ERROR_INCLUDE_MESSAGE: "never"
      CAMPUSMARKET_RATE_LIMIT_ENABLED: "true"
      # Hardcoded rather than defaulted: demo listings and demo accounts have
      # no place on a live site, and this is not a knob worth leaving within
      # reach of a stray .env line on the production box.
      CAMPUSMARKET_SEED_DEMO_DATA: "false"
      CAMPUSMARKET_ADMIN_EMAIL: "${CAMPUSMARKET_ADMIN_EMAIL:-admin@campus.edu}"
      CAMPUSMARKET_ADMIN_NAME: "${CAMPUSMARKET_ADMIN_NAME:-Campus Marketplace Admin}"
      # Required, with no fallback. The previous default was a password
      # committed to this repository, which is not a thing to hand an
      # administrator account on a public site. Compose refuses to start
      # without it rather than quietly choosing something guessable.
      CAMPUSMARKET_ADMIN_PASSWORD: "${CAMPUSMARKET_ADMIN_PASSWORD:?set CAMPUSMARKET_ADMIN_PASSWORD in .env}"
      CAMPUSMARKET_ADMIN_PASSWORD_RESET: "${CAMPUSMARKET_ADMIN_PASSWORD_RESET:-false}"
      # Where the frontend is served from. The Vercel production domain is the
      # real one; localhost is kept so a developer can point a local `npm run
      # dev` at this API when reproducing something that only happens against
      # production data.
      #
      # Vercel preview deployments get their own per-commit hostnames and are
      # NOT covered. Add a pattern like https://campus-market-*.vercel.app if
      # you need them - Spring matches these with allowedOriginPatterns, so
      # wildcards work, but note that a pattern is a standing grant to every
      # hostname it matches.
      CAMPUSMARKET_CORS_ORIGINS: "${CAMPUSMARKET_CORS_ORIGINS:-https://campus-market-mu.vercel.app,http://localhost:3000,http://localhost:5173}"
      # Container memory is the ceiling the JVM should size its heap against.
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+UseContainerSupport"

networks:
  # Created by hand on the box (`docker network create edge`) and shared with
  # the SalePilot project. External on purpose: Compose must attach to the
  # existing network, not create a second one namespaced to this project.
  edge:
    external: true
