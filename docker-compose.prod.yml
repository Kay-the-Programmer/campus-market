# Production overlay for the VPS.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Naming both files explicitly is what excludes docker-compose.override.yml and
# everything in it. Put that command in a shell alias or a Makefile target on
# the box - typing a bare `docker compose up` there would silently pull in the
# dev overrides, which is precisely the failure this split exists to prevent.
#
# Required in .env alongside POSTGRES_PASSWORD:
#   SITE_ADDRESS   the domain Caddy fetches a certificate for, e.g.
#                  campusmarket.example.com (bare domain, no scheme)

services:
  web:
    build:
      context: .
    container_name: campusmarket-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    ports:
      # The only two ports open on the host. 80 is required even though the
      # site is HTTPS-only: it carries the ACME challenge and the redirect.
      - "80:80"
      - "443:443"
    volumes:
      # Certificates and ACME account keys. Without this volume Caddy
      # re-requests a certificate on every recreate and will hit Let's
      # Encrypt's rate limit (5 per domain per week) within a day of ordinary
      # deploys.
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  api:
    environment:
      # Belt and braces. application.yml already defaults this to false, but
      # the flag is dangerous enough to be worth stating where someone reading
      # the production config can see it.
      CAMPUSMARKET_EXPOSE_DEV_TOKENS: "false"
      SERVER_ERROR_INCLUDE_MESSAGE: "never"
      CAMPUSMARKET_RATE_LIMIT_ENABLED: "true"
      CAMPUSMARKET_SEED_DEMO_DATA: "${CAMPUSMARKET_SEED_DEMO_DATA:-false}"
      CAMPUSMARKET_ADMIN_EMAIL: "${CAMPUSMARKET_ADMIN_EMAIL:-admin@campus.edu}"
      CAMPUSMARKET_ADMIN_PASSWORD: "${CAMPUSMARKET_ADMIN_PASSWORD:-Admin123!}"
      # If the frontend is hosted on another domain or port, supply comma-separated
      # origins (e.g. CAMPUSMARKET_CORS_ORIGINS=https://app.mydomain.com).
      CAMPUSMARKET_CORS_ORIGINS: "${CAMPUSMARKET_CORS_ORIGINS:-https://salepilot.space,https://www.salepilot.space,https://campusmarket.salepilot.space,https://campus-market-mu.vercel.app,https://www.campus-market-mu.vercel.app,http://localhost:3000,http://localhost:5173}"
      # Container memory is the ceiling the JVM should size its heap against.
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+UseContainerSupport"

volumes:
  caddy-data:
  caddy-config:
