<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're offline — CampusMarket</title>
  <link rel="icon" type="image/png" href="/images/logo.png" />
  <style>
    /* Inline and self-contained on purpose: this page is served precisely when
       the network is unreachable, so it cannot fetch a stylesheet or a font. */
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      background: #f8f9ff; color: #0b1c30; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      max-width: 360px; width: 100%; background: #fff; border: 1px solid #e5eeff;
      border-radius: 24px; padding: 32px 28px; text-align: center;
      box-shadow: 0 4px 20px rgba(11, 28, 48, .06);
    }
    img { width: 56px; height: 56px; object-fit: contain; }
    h1 { font-size: 19px; margin: 16px 0 8px; font-weight: 800; }
    p { font-size: 14px; line-height: 1.6; color: #434655; margin: 0 0 20px; }
    button {
      width: 100%; border: 0; border-radius: 14px; background: #2563eb; color: #fff;
      font-size: 14px; font-weight: 700; padding: 13px 20px; cursor: pointer;
    }
    button:active { background: #004ac6; }
  </style>
</head>

<body>
  <div class="card">
    <img src="/images/logo.png" alt="" />
    <h1>You're offline</h1>
    <p>CampusMarket can't reach the network right now. Anything you've already opened is still
      on your device — reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>

</html>
