name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# A second push to the same branch makes the first run irrelevant. Without
# this they queue up and the useful result waits behind stale ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ci, not install: fails on a lockfile that disagrees with package.json
      # rather than quietly resolving something different from local.
      - run: npm ci

      # The real check. Until @types/react was added this passed vacuously -
      # React resolved to `any`, so nothing in a .tsx file was verified at all.
      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend — compile and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # verify, not package: runs the tests. The Dockerfile builds with
      # -DskipTests for image-build speed, which makes this the only place
      # they run.
      - name: Compile and test
        working-directory: backend
        run: mvn -B -ntp verify

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    # Only worth the minutes once the code itself is known good.
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Proves the production images build at all. Not pushed anywhere - this
      # is a check, not a release.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
