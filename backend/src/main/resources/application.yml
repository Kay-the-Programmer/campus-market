spring:
  application:
    name: campusmarket-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campusmarket}
    username: ${SPRING_DATASOURCE_USERNAME:campusmarket}
    password: ${SPRING_DATASOURCE_PASSWORD:campusmarket}

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate must never mutate it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Resolve lazy associations in batches instead of one SELECT per row.
        #
        # The feed is the case that made this necessary: DtoMapper reads both
        # listing.getImages() and listing.getDietaryTags() for every row, so a
        # 24-item page issued 48 extra queries to fill in two collections. With
        # a batch size, Hibernate gathers the pending proxies and fetches them
        # with one `... where listing_id in (?, ?, ...)` per collection - the
        # same page becomes 3 queries.
        #
        # 32 rather than the 60-item page cap: the win is almost entirely in
        # going from N to a handful, and an oversized IN list is its own cost.
        # Applies to every lazy association in the app, not only this one.
        default_batch_fetch_size: 32

  flyway:
    enabled: true
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      # Comfortably above the ~8MB service-level cap in ImageStorageService -
      # that check should produce the friendly error, not a container-level
      # rejection with no body.
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  error:
    # Raw exception text is useful at a terminal and free reconnaissance on a
    # public API - SQL constraint names, class names, fragments of a query.
    # Defaults closed; the dev compose file sets it back to "always".
    #
    # Safe to withhold because it is not what the frontend reads: every handled
    # failure carries a deliberate "error" field from GlobalExceptionHandler,
    # and api.ts uses that, never Spring's "message".
    include-message: ${SERVER_ERROR_INCLUDE_MESSAGE:never}

# Health only. The default exposure is wider than it looks and includes
# endpoints worth nobody's attention on a public host; /actuator/health is all
# the container healthcheck needs.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # No component breakdown - "UP" is the answer, and the database and disk
      # detail underneath it is not for unauthenticated callers.
      show-details: never
  info:
    env:
      enabled: false

campusmarket:
  # Dev convenience: return verification / password-reset tokens in API responses
  # so the flows are exercisable without a mail provider. MUST be false in prod.
  expose-dev-tokens: ${CAMPUSMARKET_EXPOSE_DEV_TOKENS:false}
  cors-origins: ${CAMPUSMARKET_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  seed-demo-data: ${CAMPUSMARKET_SEED_DEMO_DATA:true}
  admin-email: ${CAMPUSMARKET_ADMIN_EMAIL:admin@campus.edu}
  admin-password: ${CAMPUSMARKET_ADMIN_PASSWORD:Admin123!}
  admin-name: ${CAMPUSMARKET_ADMIN_NAME:Campus Marketplace Admin}
  session-ttl-days: 14
  verification-token-ttl-minutes: 1440
  reset-token-ttl-minutes: 30
  resend-cooldown-seconds: 60
  max-failed-logins: 5
  login-lockout-minutes: 15
  # Per-IP throttling (RateLimitFilter). The account lockout above is per
  # account and does nothing about signup floods or address enumeration.
  rate-limit-enabled: ${CAMPUSMARKET_RATE_LIMIT_ENABLED:false}
  rate-limit-auth-per-minute: 20
  rate-limit-write-per-minute: 120
  uploads-dir: ${CAMPUSMARKET_UPLOADS_DIR:uploads}
  # Firebase service-account key JSON (the whole file contents, not a path).
  # Blank disables "Continue with Google" without affecting anything else.
  firebase-credentials-json: ${CAMPUSMARKET_FIREBASE_CREDENTIALS_JSON:}
  # Blank keeps image uploads on local disk (uploads-dir above). Set both to
  # move them to Cloud Storage - see the note beside this var in
  # docker-compose.yml for the one-time bucket setup that requires.
  gcs-bucket: ${CAMPUSMARKET_GCS_BUCKET:}
  gcs-credentials-json: ${CAMPUSMARKET_GCS_CREDENTIALS_JSON:}

logging:
  level:
    com.campusmarket: INFO
