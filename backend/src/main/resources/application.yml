spring:
  application:
    name: campusmarket-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campusmarket}
    username: ${SPRING_DATASOURCE_USERNAME:campusmarket}
    password: ${SPRING_DATASOURCE_PASSWORD:campusmarket}

  # SMTP. No default host on purpose: Spring Boot builds a JavaMailSender only
  # when spring.mail.host is set, and SmtpMailer keys "can we send mail?" off
  # whether that bean exists. Left unset, every send is written to the log
  # instead - which is what a developer wants and what an unconfigured
  # production box should do rather than failing to start.
  #
  # Port 587 with STARTTLS is the near-universal submission port. Use 465 only
  # with a provider that wants implicit TLS, and then set
  # spring.mail.properties.mail.smtp.ssl.enable=true instead of starttls.
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            # Refuse to continue in the clear if the server will not upgrade.
            # Without this, a misconfigured server silently downgrades and
            # credentials cross the network in plaintext.
            required: true
        # Caps, so a hung provider cannot pin a mail thread indefinitely -
        # the campaign executor has one thread and a stall would stop every
        # later campaign behind it.
        smtp.connectiontimeout: 10000
        smtp.timeout: 15000
        smtp.writetimeout: 15000

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate must never mutate it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Resolve lazy associations in batches instead of one SELECT per row.
        #
        # The feed is the case that made this necessary: DtoMapper reads both
        # listing.getImages() and listing.getDietaryTags() for every row, so a
        # 24-item page issued 48 extra queries to fill in two collections. With
        # a batch size, Hibernate gathers the pending proxies and fetches them
        # with one `... where listing_id in (?, ?, ...)` per collection - the
        # same page becomes 3 queries.
        #
        # 32 rather than the 60-item page cap: the win is almost entirely in
        # going from N to a handful, and an oversized IN list is its own cost.
        # Applies to every lazy association in the app, not only this one.
        default_batch_fetch_size: 32

  flyway:
    enabled: true
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      # Comfortably above the ~8MB service-level cap in ImageStorageService -
      # that check should produce the friendly error, not a container-level
      # rejection with no body.
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  error:
    # Raw exception text is useful at a terminal and free reconnaissance on a
    # public API - SQL constraint names, class names, fragments of a query.
    # Defaults closed; the dev compose file sets it back to "always".
    #
    # Safe to withhold because it is not what the frontend reads: every handled
    # failure carries a deliberate "error" field from GlobalExceptionHandler,
    # and api.ts uses that, never Spring's "message".
    include-message: ${SERVER_ERROR_INCLUDE_MESSAGE:never}

# Health only. The default exposure is wider than it looks and includes
# endpoints worth nobody's attention on a public host; /actuator/health is all
# the container healthcheck needs.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # No component breakdown - "UP" is the answer, and the database and disk
      # detail underneath it is not for unauthenticated callers.
      show-details: never
  info:
    env:
      enabled: false

campusmarket:
  # Dev convenience: return verification / password-reset tokens in API responses
  # so the flows are exercisable without a mail provider. MUST be false in prod.
  expose-dev-tokens: ${CAMPUSMARKET_EXPOSE_DEV_TOKENS:false}
  # The single source of truth for the CORS allowlist. These are origins the
  # FRONTEND is served from - not this API's own domain, which needs no entry
  # because a request from the same origin is never a CORS request.
  #
  # WebConfig logs the resolved list on startup; check that line before
  # theorising about a CORS failure. Wildcards are permitted (Spring matches
  # these with allowedOriginPatterns) but a pattern is a standing grant to
  # every hostname it matches, so prefer exact origins.
  cors-origins: ${CAMPUSMARKET_CORS_ORIGINS:http://localhost:3000,http://localhost:5173,https://campus-market-mu.vercel.app}
  seed-demo-data: ${CAMPUSMARKET_SEED_DEMO_DATA:true}
  admin-email: ${CAMPUSMARKET_ADMIN_EMAIL:admin@campus.edu}
  # No default. This used to fall back to a literal password, so an operator who
  # never set the variable got an administrator account whose credentials are in
  # this repository. Blank means no admin is created and startup logs why.
  admin-password: ${CAMPUSMARKET_ADMIN_PASSWORD:}
  admin-name: ${CAMPUSMARKET_ADMIN_NAME:Campus Marketplace Admin}

  # --- Email -----------------------------------------------------------
  # The transport itself is spring.mail.* below. These are the things the
  # application needs on top of a working SMTP connection.
  #
  # Blank mail-from disables sending as surely as a missing host does: a
  # message with no From is refused by every provider, so Mailer treats it as
  # "not configured" and logs instead.
  mail-from: ${CAMPUSMARKET_MAIL_FROM:}
  mail-from-name: ${CAMPUSMARKET_MAIL_FROM_NAME:CampusMarket}
  # Absolute, public, no trailing slash - it becomes the unsubscribe link and
  # every deep link in an email. Campaigns refuse to send without it, because
  # a campaign whose unsubscribe link does not work is worse than no campaign.
  app-base-url: ${CAMPUSMARKET_APP_BASE_URL:}
  mail-batch-size: ${CAMPUSMARKET_MAIL_BATCH_SIZE:25}
  mail-batch-pause-millis: ${CAMPUSMARKET_MAIL_BATCH_PAUSE_MILLIS:1000}
  # One-shot: rotates the existing admin's password to admin-password on the
  # next boot, then should be unset again. See AppProperties for why this is
  # not simply applied every time.
  admin-password-reset: ${CAMPUSMARKET_ADMIN_PASSWORD_RESET:false}
  session-ttl-days: 14
  verification-token-ttl-minutes: 1440
  reset-token-ttl-minutes: 30
  resend-cooldown-seconds: 60
  max-failed-logins: 5
  login-lockout-minutes: 15
  # Per-IP throttling (RateLimitFilter). The account lockout above is per
  # account and does nothing about signup floods or address enumeration.
  rate-limit-enabled: ${CAMPUSMARKET_RATE_LIMIT_ENABLED:false}
  rate-limit-auth-per-minute: 20
  rate-limit-write-per-minute: 120
  # Where listing and promo images are written. The only image backend: a
  # directory, proven writable at startup by ImageStorageService, served back
  # at /api/uploads/**. In the container this is a Docker volume so the files
  # outlive a redeploy.
  uploads-dir: ${CAMPUSMARKET_UPLOADS_DIR:uploads}
  # Firebase service-account key JSON (the whole file contents, not a path).
  # Blank disables "Continue with Google" without affecting anything else.
  firebase-credentials-json: ${CAMPUSMARKET_FIREBASE_CREDENTIALS_JSON:}

logging:
  level:
    com.campusmarket: INFO
